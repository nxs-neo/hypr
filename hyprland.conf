#Hyprland Configuration
# https://wiki.hypr.land/Configuring/

# ==================
# Defaults
# ==================
$terminal = ghostty
$menu = $ipc launcher toggle
$browser = flatpak run app.zen_browser.zen
$mainMod = SUPER
$fileManager = nautilus


# MONITOR CONFIG
# ==================
# monitor = eDP-2, 2560x1600@239.998993, 2560x0, 1, vrr, 1
monitor = , preferred,auto,auto

# ==================
# STARTUP APPS
# ==================
# exec-once = systemctl --user start hyprland-session.target # THIS LAUNCHES DMS SHELL IDFK HOW
exec-once = qs -c noctalia-shell
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = gnome-keyring-daemon --start --components=secrets,ssh

# ==================
# INPUT CONFIG
# ==================
input {
    kb_layout = us
    numlock_by_default = true
}

# ==================
# GENERAL LAYOUT
# ==================
general {
  gaps_in = 5
  gaps_out = 10
}

# ==================
# DECORATION
# ==================
decoration {
  rounding = 20
  rounding_power = 2

  shadow {
    enabled = true
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 3
    passes = 2
    vibrancy = 0.1696
  }
}

# ==================
# ANIMATIONS
# ==================
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
    animation = fade, 1, 3, default
    animation = border, 1, 3, default
}

# ==================
# LAYOUTS
# ==================
dwindle {
    preserve_split = true
}

master {
    mfact = 0.5
}

# ==================
# MISC
# ==================
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}


layerrule = no_anim on, match:namespace ^(quickshell)$

source = ./window.conf
source = ./devices.conf
# source = ./rice.conf

source = ./noctalia/binds.conf
source = ./noctalia/window.conf
source = ./noctalia/noctalia-colors.conf

