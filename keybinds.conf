###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Common binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, R, exec, $terminal
bind = $mainMod Shift_L, R, exec, kitten quick-access-terminal
bindr = $mainMod, SUPER_L, exec, $menu
bind = $mainMod, L, exec, $lockscreen
bind = $mainMod SHIFT, L, exec, uwsm stop
bind = $mainMod, E, exec, $fileManager
bind = Control_L Shift_L, escape, exec, flatpak run io.missioncenter.MissionCenter
bind = $mainMod, B, exec, $browser

bind = $mainMod, Q, killactive,
bind = $mainMod Shift_L, Q, forcekillactive
bind = $mainMod, V, togglefloating,
bind = , F11, fullscreen
bind = $mainMod, tab, hyprexpo:expo, toggle
bind = , Print, exec, hyprshot-gui

# bind = $mainMod Shift_L, S, exec, grim -g "$(slurp -o -r -c '##ff0000ff')" -t ppm - | satty --filename - --fullscreen --output-filename ~/Pictures/Screenshots/$(date '+%Y%m%d-%H:%M:%S').png

#ALT TAB
$key = tab
$mod = alt
$reverse = grave

bind = $mod, $key, exec, hyprswitch gui --mod-key $mod --key $key --close mod-key-release --reverse-key=key=$reverse --sort-recent && hyprswitch dispatch
bind = $mod $reverse, $key, exec, hyprswitch gui --mod-key $mod --key $key --close mod-key-release --reverse-key=key=$reverse --sort-recent && hyprswitch dispatch -r

# use the if switching to the next window with the opening keypress is unwanted
#bind = $mod, $key, exec, hyprswitch gui --mod-key $mod --key $key --close mod-key-release --reverse-key=key=$reverse
#bind = alt $reverse, $key, exec, hyprswitch gui --mod-key $mod --key $key --close mod-key-release --reverse-key=key=$reverse

# Move focus with mainMod + aWASD
bind = $mainMod, a, movefocus, l
bind = $mainMod, d, movefocus, r
bind = $mainMod, w, movefocus, u
bind = $mainMod, s, movefocus, d

bind = $mainMod Shift_L, a, movewindow, l
bind = $mainMod Shift_L, d, movewindow, r
bind = $mainMod Shift_L, w, movewindow, u
bind = $mainMod Shift_L, s, movewindow, d
bind = $mainMod Shift_L, w a, movewindow, ul
bind = $mainMod Shift_L, s a, movewindow, dl
bind = $mainMod Shift_L, w d, movewindow, ur
bind = $mainMod Shift_L, s d, movewindow, dr

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod, LEFT, exec, hyprnome --previous -c
bind = $mainMod, RIGHT, exec, hyprnome -c

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, exec, hyprnome --previous -c
bind = $mainMod, mouse_up, exec, hyprnome -c

# Move/resize windows with LEFT ALT + LMB/RMB and dragging
bindm = Alt_L, mouse:272, movewindow
bindm = Alt_L, mouse:273, resizewindowexec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Layan-white-cursors'

# Laptop Media Keys
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 10%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioStop, exec, swayosd-client --playerctl stop
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous
